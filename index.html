<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>需要密碼</title><style>
:root{color-scheme:light dark;--bg:rgb(243 246 248);--surface:#fff;--surface2:rgb(237 243 247);--text:rgb(23 32 42);--muted:rgb(97 113 132);--line:rgb(217 226 232);--blue:rgb(23 107 155);--blue2:rgb(220 238 248);--red:rgb(189 49 65);--green:rgb(22 116 83);--amber:rgb(149 99 24);--amberbg:rgb(255 243 214);--shadow:0 8px 28px rgb(27 53 76 / 0.078);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:77.5rem;margin:auto;padding:18px 16px 48px}.hero{background:linear-gradient(135deg,rgb(11 41 64),rgb(24 92 127));color:rgb(244 251 255);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.14em;color:rgb(169 217 239)}.hero h1{font-size:26px;margin:3px 0 8px}.dates{font-size:17px;font-weight:700}.meta-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill,.tag{display:inline-flex;align-items:center;border:1px solid currentColor;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.pill.ok{color:rgb(169 239 210)}.pill.warn{color:rgb(255 225 162)}.hero-note{margin:14px 0 0;color:rgb(216 234 243);font-size:13px}.stale{margin-top:12px;background:rgb(255 240 203);color:rgb(81 57 0);padding:11px 13px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin:4px 0}.stat small{color:var(--muted)}.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}.tab{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.section-head h2,.section-head h3{margin:0}.section-head p,.intro{margin:5px 0;color:var(--muted)}.count{background:var(--blue2);color:var(--blue);border-radius:999px;padding:3px 9px;font-size:13px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin:14px 0}.filters input,.filters select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px}.toggles{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}.stock-cards{display:none}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:12px;background:var(--surface2)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.stock-title strong{display:block;font-size:15px}.stock-title small{color:var(--muted)}.rank{color:var(--blue);font-weight:800;margin-right:7px}.rank-cell{color:var(--blue);font-weight:800}.up{color:var(--red)}.down{color:var(--green)}.tag{padding:2px 7px;margin:2px;color:var(--muted)}.tag.hot{color:var(--red);background:rgb(253 232 234)}.tag.warn{color:var(--amber);background:var(--amberbg)}.spark{width:118px;height:38px;display:block}.detail-row td{padding:0}.detail{padding:14px;background:var(--surface2)}details summary{cursor:pointer;color:var(--blue);font-weight:700}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.detail-grid div{background:var(--surface);padding:9px;border-radius:8px;overflow-wrap:anywhere}.detail-grid dt{font-size:11px;color:var(--muted)}.detail-grid dd{margin:2px 0;font-size:13px}.subsection{margin-top:18px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}.metric-card h3{margin:0 0 8px}.metric-card dl{margin:0}.metric-card div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.metric-card dt{color:var(--muted)}.metric-card dd{margin:0;font-weight:700}.recent{display:grid;gap:8px}.recent-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}.explain-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.explain-list article{background:var(--surface2);border-radius:12px;padding:14px}.explain-list h3{margin:0 0 6px;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:18px 4px}.unlock{max-width:480px;margin:12vh auto;background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}.unlock input{width:100%;padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:9px}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px}.logout{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow)}.error{color:var(--red)}[hidden]{display:none!important}
@media(max-width:767px){.shell{padding:10px 10px 36px}.hero{border-radius:16px;padding:17px}.hero h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.panel{padding:12px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.table-wrap{display:none}.stock-cards{display:grid;gap:10px}.stock-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--surface2)}.stock-top,.price-row,.limit-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.stock-top h3{margin:0;font-size:18px}.stock-top small,.history-note{color:var(--muted)}.price-row{margin-top:9px}.price{font-size:22px;font-weight:750}.limit-row{font-size:14px;margin:3px 0 8px}.stock-card .spark{width:100%;height:55px;background:var(--surface);border-radius:8px}.tags{margin:7px -2px}.history-note{font-size:12px;margin:7px 0}.detail-grid{grid-template-columns:1fr 1fr}.cards3{grid-template-columns:1fr}.recent-row{grid-template-columns:1fr 1fr}.explain-list{grid-template-columns:1fr}.section-head{align-items:center}}
@media(prefers-color-scheme:dark){:root{--bg:rgb(8 19 29);--surface:rgb(16 31 44);--surface2:rgb(21 40 55);--text:rgb(230 240 246);--muted:rgb(156 176 191);--line:rgb(41 64 80);--blue:rgb(120 201 240);--blue2:rgb(23 60 81);--red:rgb(255 135 147);--green:rgb(98 209 168);--amber:rgb(242 199 121);--amberbg:rgb(64 53 30);--shadow:none}.hero{background:linear-gradient(135deg,rgb(10 38 58),rgb(16 76 106))}.stale{background:rgb(58 48 26);color:rgb(255 227 164)}.tag.hot{background:rgb(72 36 43)}}
</style></head><body><noscript><p>需要密碼</p></noscript>

    return `全部開盤買進，扣成本後${outcome}（當天收盤賣 ${rate(history.return_a_mean)}、隔天開盤賣 ${rate(history.return_b_mean)}）`;

    if (item.attention_on_signal === "是") out.push(tag("注意", "warn"));

    if (item.is_innovation_board === "是") out.push(tag("創新板"));

    (history || []).forEach((row,index) => { if (row.close === null) { if (current.length) segments.push(current); current=[]; return; } current.push(`${4 + index*112/Math.max(1,history.length-1)},${34-(Number(row.close)-lo)/span*28}`); });
    if (current.length) segments.push(current);
    const color = values.at(-1) >= values[0] ? "var(--red)" : "var(--green)";
    return `<svg class="spark" viewBox="0 0 120 38" role="img" aria-label="近 20 個交易日收盤走勢">${segments.map(points=>`<polyline points="${points.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}</svg>`;
  };
  const historyText = (item, list) => {
    const rule = list?.list_id?.startsWith("B_R2_") ? "R2" : list?.list_id?.startsWith("B_R1_") ? "R1" : null;
    if (rule) {
      const source = list?.list_id?.endsWith("_v2") ? data.m2_reference?.m2_t4 : data.m2_reference?.m2_t2;
      const history = source?.[rule] || {};
      const hits = history.hit_n, known = history.selected_known_n;
      return known ? `歷史命中 ${rate(history.precision)}（${hits ?? 0}/${known}）` : "歷史命中：未知";
    }
    const groups = Object.values(item.m2_history || {}).map(period => period.board_streak).filter(Boolean);
    const n = groups.reduce((sum,row)=>sum+(row.sample_n || 0),0), unavailable = groups.reduce((sum,row)=>sum+(row.buy_unavailable_n || 0),0);
    return n ? `歷史開盤買不到 ${rate(unavailable/n)}（${unavailable}/${n}）` : "歷史開盤買不到：未知";
  };
  const detail = item => {
    const names = {signal_close:"T 日收盤",price_change_rate_display:"T 日漲跌幅",target_limit_up:"T+1 漲停價",target_limit_source:"漲停價來源",volume_ratio_20:"20 日量比",capital_group:"資本額區間",attention_on_signal:"T 日注意",disposal_on_target:"T+1 處置",disposal_matching_interval_minutes:"撮合間隔（分鐘）",disposal_prepayment_required:"需要預收款券",disposal_prepayment_threshold:"預收門檻",daytrade_on_signal:"T 日當沖名單",touched_limit_not_close:"T 日碰過漲停",board_streak:"連板數",one_price_limit:"一價漲停",is_innovation_board:"創新板",is_ky:"KY"};
    return Object.entries(names).filter(([key])=>key in item).map(([key,label])=>`<div><dt>${label}</dt><dd>${key.includes("rate") ? pct(item[key]) : esc(item[key])}</dd></div>`).join("");
  };
  const filtered = list => {
    let rows = ((list || {}).candidates || []).map((item,snapshotIndex)=>({...item,_snapshotRank:snapshotIndex+1})).filter(item => (!query || `${item.code}${item.name}`.toLowerCase().includes(query)) && (market === "all" || item.market === market) && (capital === "all" || item.capital_group === capital) && (!hideDisposal || item.disposal_on_target !== "是") && (!onlyDaytrade || item.daytrade_on_signal === "是"));
    const value = (item,key) => Number(item[key] ?? -Infinity);
    rows.sort((a,b) => sort === "rank" ? a._snapshotRank-b._snapshotRank : sort === "change" ? value(b,"price_change_rate_display")-value(a,"price_change_rate_display") || String(a.code).localeCompare(String(b.code)) : sort === "volume" ? value(b,"volume_ratio_20")-value(a,"volume_ratio_20") || String(a.code).localeCompare(String(b.code)) : sort === "code" ? String(a.code).localeCompare(String(b.code)) : value(b,"board_streak")-value(a,"board_streak") || String(a.code).localeCompare(String(b.code)));
    return rows;
  };
  const filters = () => { const sortOptions = isTomorrow ? [["rank","名次"],["change","漲跌幅"],["volume","量比"],["code","代號"]] : [["streak","連板"],["change","漲跌幅"],["volume","量比"],["code","代號"]]; return `<div class="filters"><input class="search" data-filter="query" aria-label="搜尋股票代號或名稱" placeholder="搜尋代號或名稱" value="${esc(filterState.query || "")}"><select data-filter="market" aria-label="市場"><option value="all">全部市場</option><option value="TWSE" ${market==="TWSE"?"selected":""}>上市</option><option value="TPEX" ${market==="TPEX"?"selected":""}>上櫃</option></select><select data-filter="capital" aria-label="資本額區間">${["all","<50億","50至未滿100億","100至未滿150億","150至未滿200億","200億以上"].map(value=>`<option value="${value}" ${capital===value?"selected":""}>${value==="all"?"全部資本額":value}</option>`).join("")}</select><select data-filter="sort" aria-label="排序">${sortOptions.map(([value,label])=>`<option value="${value}" ${sort===value?"selected":""}>${label}</option>`).join("")}</select><div class="toggles"><label><input type="checkbox" data-filter="hideDisposal" ${hideDisposal?"checked":""}> 隱藏 T+1 處置中</label><label><input type="checkbox" data-filter="onlyDaytrade" ${onlyDaytrade?"checked":""}> 只看 T 日當沖名單內</label></div></div>`; };
  const stockViews = list => {
    const rows = filtered(list);
    const showRank = list?.list_id?.startsWith("B_R2_") || list?.list_id?.startsWith("B_R1_");
    const showTurnover = list?.list_id?.endsWith("_v2");
    if (!list || !list.available) return `<div class="empty">本次清單尚未產生；其他清單不受影響。</div>`;
    if (!rows.length) return `<div class="empty">沒有符合目前篩選條件的股票。</div>`;
    const cards = rows.map(item=>`<article class="stock-card" data-code="${esc(item.code)}" data-rank="${item._snapshotRank}"><div class="stock-top"><h3>${showRank?`<span class="rank">#${item._snapshotRank}</span>`:""}${esc(item.name)}</h3><small>${esc(item.code)} · ${item.market==="TWSE"?"上市":"上櫃"}</small></div><div class="price-row"><span class="price">${esc(item.signal_close)}</span><strong class="${cssChange(item.price_change_rate_display)}">${pct(item.price_change_rate_display)}</strong></div><div class="limit-row"><span>T+1 漲停價</span><strong>${esc(item.target_limit_up)}</strong></div>${showTurnover?`<div class="limit-row"><span>T 日成交金額</span><strong>${turnover(item.signal_turnover)}</strong></div>`:""}${spark(item.history_20)}<div class="tags">${labels(item)}</div><p class="history-note">${historyText(item,list)}</p><details><summary>查看全部欄位</summary><dl class="detail-grid">${detail(item)}</dl></details></article>`).join("");
    const tableRows = rows.map(item=>`<tr data-code="${esc(item.code)}" data-rank="${item._snapshotRank}">${showRank?`<td class="num rank-cell">#${item._snapshotRank}</td>`:""}<td><div class="stock-title"><strong>${esc(item.name)}</strong><small>${esc(item.code)} · ${item.market==="TWSE"?"上市":"上櫃"}</small></div></td><td class="num">${esc(item.signal_close)}<br><span class="${cssChange(item.price_change_rate_display)}">${pct(item.price_change_rate_display)}</span></td>${showTurnover?`<td class="num">${turnover(item.signal_turnover)}</td>`:""}<td class="num">${esc(item.target_limit_up)}</td><td>${spark(item.history_20)}</td><td>${labels(item)}<div class="history-note">${historyText(item,list)}</div></td><td><details><summary>詳細</summary><dl class="detail-grid">${detail(item)}</dl></details></td></tr>`).join("");
    return `<div class="stock-cards" data-list-id="${esc(list.list_id)}">${cards}</div><div class="table-wrap" data-list-id="${esc(list.list_id)}"><table><thead><tr>${showRank?'<th class="num">名次</th>':""}<th>股票</th><th class="num">收盤／漲跌</th>${showTurnover?'<th class="num">T 日成交金額</th>':""}<th class="num">T+1 漲停價</th><th>20 日走勢</th><th>標籤／歷史參考</th><th>全部欄位</th></tr></thead><tbody>${tableRows}</tbody></table></div>`;
  };
  const listSection = (list,title,description) => `<section class="panel subsection"><div class="section-head"><div><h2>${title}</h2><p>${description}</p></div><span class="count">${list?.count ?? 0} 檔</span></div>${stockViews(list)}</section>`;
  const perfCard = (listId,label) => { const p=data.performance?.[listId]||{}, v2=listId.endsWith("_v2"), buckets=(p.rank_buckets||[]).map(row=>`<div><dt>#${esc(row.bucket)}</dt><dd>${rate(row.precision_daily_mean)}</dd></div>`).join(""); return `<article class="metric-card"><h3>${label}</h3><dl><div><dt>有效天數</dt><dd>${p.valid_days ?? 0}</dd></div><div><dt>事件數</dt><dd>${p.event_n ?? 0}</dd></div><div><dt>P@${v2?30:10} 每日平均</dt><dd>${rate(p.precision_daily_mean)}</dd></div><div><dt>同期基準</dt><dd>${rate(p.baseline_daily_mean)}</dd></div>${buckets}<div><dt>報酬 (a) 平均</dt><dd>${rate(p.return_a_mean)}</dd></div></dl></article>`; };
  const recent = (listId,label) => { const rows=data.recent_results?.[listId]||[]; return `<section class="panel subsection"><h3>${label}：最近 10 個交易日</h3><div class="recent">${rows.length ? rows.map(row=>row.status==="pending"?`<div class="recent-row"><strong>${esc(row.signal_date)} → ${esc(row.target_date)}</strong><span>尚未對答案</span><span>—</span><span>—</span></div>`:`<div class="recent-row"><strong>${esc(row.signal_date)} → ${esc(row.target_date)}</strong><span>命中 ${row.hit_n}/${row.known_n}</span><span>開盤鎖死 ${row.open_locked_n}</span><span>報酬 ${rate(row.return_a_mean)}</span></div>`).join("") : `<div class="empty">尚未對答案</div>`}</div></section>`; };
  const meta=data.meta||{}, summary=data.summary||{};
  const degradedReason=(meta.degraded_sources||[]).map(item=>item.source||"未知來源").join("、");
  const hero=`<header class="hero"><div class="eyebrow">TAIWAN LIMIT-UP RESEARCH</div><h1>台股漲停前瞻紀錄</h1><div class="dates">${esc(meta.signal_date||"尚無")} T → ${esc(meta.target_date||"尚無")} T+1</div><div class="meta-line"><span class="pill ${meta.is_latest?"ok":"warn"}">${meta.is_latest?"最新":"非最新"}</span><span class="pill ${meta.data_status==="complete"?"ok":"warn"}">${meta.data_status==="complete"?"資料完整":"資料不完整"}</span><span class="pill warn">初步</span><span class="pill warn">歷史統計</span><span class="pill warn">不是買賣建議</span></div>${meta.stale_reason?`<div class="stale" role="status">${esc(meta.stale_reason)}</div>`:""}${degradedReason?`<div class="stale" role="status">資料不完整：${esc(degradedReason)}</div>`:""}<p class="hero-note">產生時間 ${esc(meta.generated_at||"尚無")} · 執行狀態 ${esc(meta.status_text||"尚無")}</p></header>`;
  const stats=`<section class="stats"><article class="stat"><span>今日收盤漲停</span><strong>${summary.limit_up_n ?? "—"} 檔</strong><small>連 3 板以上 ${summary.board_streak_3_n ?? "—"} · 一價 ${summary.one_price_n ?? "—"}</small></article><article class="stat"><span>明日候選 R2 v2</span><strong>${summary.r2_n ?? "—"} 檔</strong><small>依規則排序，不是機率</small></article><article class="stat"><span>A 累計開盤買不到</span><strong>${rate(summary.a_unavailable_rate)}</strong><small>${summary.a_unavailable_n ?? 0}/${summary.a_event_n ?? 0}</small></article><article class="stat"><span>R2 v2 前瞻 P@30／同期基準</span><strong>${rate(summary.r2_precision)}</strong><small>基準 ${rate(summary.r2_baseline)}</small></article></section>`;
  const nav=`<nav class="tabs" aria-label="內容分頁">${[["today","今日漲停"],["tomorrow","明日可能漲停"],["performance","前瞻成績"],["explain","說明"]].map(([value,label])=>`<button class="tab ${tab===value?"active":""}" data-tab="${value}" aria-label="切換到${label}">${label}</button>`).join("")}</nav>`;
  let content="";
  if(tab==="today") content=`<section class="panel"><div class="section-head"><div><h2>今日漲停</h2><p>T 日收盤漲停清單，觀察 T+1 的可買性與結果。</p></div><span class="count">${data.lists?.A_all_v0?.count ?? 0} 檔</span></div>${filters()}${stockViews(data.lists?.A_all_v0)}</section>`;
  if(tab==="tomorrow") { const r2=data.m2_reference?.m2_t4?.R2||{}, buckets=(r2.rank_buckets||[]).map(row=>`#${esc(row.bucket)} ${rate(row.precision)}`).join("、"); content=`<section class="panel"><h2>明日可能漲停</h2><p class="intro">歷史命中率 ${rate(r2.precision)}（${r2.hit_n ?? 0}/${r2.selected_known_n ?? 0}），同日基準 ${rate(r2.baseline_precision)}；${returnSummary(r2)}。資料期間 ${period(r2)}。名次分段：${buckets}。第 21～30 名多半只在碰漲停股票很多的熱門日才有；同一天比較，各段名次的命中率差不多，不代表後面的名次比較好。</p>${filters()}</section>${listSection(data.lists?.B_R2_v2,"主要規則 R2 v2","前 30 名、不設成交金額門檻；命中率不是獲利保證。")}${listSection(data.lists?.B_R1_v2,"對照 R1 v2","前 30 名、不設成交金額門檻；只按 T 日漲幅排序。")}`; }
  if(tab==="performance") content=`<section class="panel"><h2>累計前瞻成績</h2><p class="intro">只計入開盤前寫入的第一版清單；未知結果不當成 0。</p><div class="cards3">${perfCard("A_all_v0","今日漲停 A")}${perfCard("B_R2_v2","主要規則 R2 v2")}${perfCard("B_R1_v2","對照 R1 v2")}</div></section><section class="panel subsection"><h2>舊規則（前 10 名、成交金額 ≥ 1,000 萬）</h2><div class="cards3">${perfCard("B_R2_v1","舊規則 R2 v1")}${perfCard("B_R1_v1","舊規則 R1 v1")}</div></section>${recent("A_all_v0","A")}${recent("B_R2_v2","R2 v2")}${recent("B_R1_v2","R1 v2")}${recent("B_R2_v1","R2 v1 舊規則")}${recent("B_R1_v1","R1 v1 舊規則")}`;
  if(tab==="explain") content=`<section class="panel"><h2>說明</h2><div class="explain-list"><article><h3>T 與 T+1</h3><p>T 是清單資料交易日，T+1 是交易日曆中的下一個交易日，不是曆日加一。</p></article><article><h3>收盤與漲跌幅</h3><p>官方盤後收盤價；紅色加號代表上漲，綠色減號代表下跌，並以符號輔助辨識。</p></article><article><h3>20 日量比</h3><p>T 日成交量相對前 20 個可用交易日的平均；資料不足時顯示未知。</p></article><article><h3>處置與當沖</h3><p>處置顯示撮合間隔與預收門檻；當沖名單以 T 日官方名單為準。</p></article><article><h3>前瞻截止規則</h3><p>${esc(data.explanation?.cutoff_rule)}</p></article><article><h3>資料來源與更新</h3><p>${(data.explanation?.sources||[]).map(esc).join("、")}。${esc(data.explanation?.update_rule)}</p></article></div></section>`;
  return `<div class="shell">${hero}${stats}${nav}${content}<footer>${esc(data.disclaimer)} 數字均由版本化資料與程式產生。</footer></div>`;
}
</script>
<script>
function startSite(data) {
  const root = document.getElementById("site-root");
  const common = {query:"",market:"all",capital:"all",hideDisposal:false,onlyDaytrade:false};
  const state = {tab:"today",filters:{today:{...common,sort:"streak"},tomorrow:{...common,sort:"rank"}}};
  function draw() {
    root.innerHTML = renderApp(data, state);
    root.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => {state.tab=button.dataset.tab; draw(); window.scrollTo({top:0,behavior:"smooth"});}));
    root.querySelectorAll("[data-filter]").forEach(control => control.addEventListener(control.tagName === "INPUT" && control.type === "text" ? "input" : "change", () => {
      const keepSearchFocus = control.dataset.filter === "query";
      state.filters[state.tab][control.dataset.filter] = control.type === "checkbox" ? control.checked : control.value;
      draw();
      if (keepSearchFocus) { const search=root.querySelector('[data-filter="query"]'); search.focus(); search.setSelectionRange(search.value.length,search.value.length); }
    }));
  }
  draw();
}

(() => {const storageKey="tw-limitup-site-password",payload=JSON.parse(document.getElementById("payload").textContent),app=document.getElementById("unlock-app"),form=document.getElementById("unlock"),input=document.getElementById("password"),error=document.getElementById("error"),logout=document.getElementById("logout");app.hidden=false;async function unlock(password){error.textContent="";try{const text=await decryptPayload(password,payload);startSite(JSON.parse(text));localStorage.setItem(storageKey,password);app.hidden=true;logout.hidden=false;}catch(failure){document.getElementById("site-root").textContent="";localStorage.removeItem(storageKey);app.hidden=false;logout.hidden=true;error.textContent="密碼錯誤，請重試。";}}form.addEventListener("submit",event=>{event.preventDefault();unlock(input.value);});logout.addEventListener("click",()=>{localStorage.removeItem(storageKey);location.reload();});const saved=localStorage.getItem(storageKey);if(saved)unlock(saved);})();</script></body></html>
