<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>需要密碼</title><style>
:root{color-scheme:light dark;--bg:rgb(243 246 248);--surface:#fff;--surface2:rgb(237 243 247);--text:rgb(23 32 42);--muted:rgb(97 113 132);--line:rgb(217 226 232);--blue:rgb(23 107 155);--blue2:rgb(220 238 248);--red:rgb(189 49 65);--green:rgb(22 116 83);--amber:rgb(149 99 24);--amberbg:rgb(255 243 214);--shadow:0 8px 28px rgb(27 53 76 / 0.078);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:77.5rem;margin:auto;padding:18px 16px 48px}.hero{background:linear-gradient(135deg,rgb(11 41 64),rgb(24 92 127));color:rgb(244 251 255);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.14em;color:rgb(169 217 239)}.hero h1{font-size:26px;margin:3px 0 8px}.dates{font-size:17px;font-weight:700}.meta-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill,.tag{display:inline-flex;align-items:center;border:1px solid currentColor;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.pill.ok{color:rgb(169 239 210)}.pill.warn{color:rgb(255 225 162)}.hero-note{margin:14px 0 0;color:rgb(216 234 243);font-size:13px}.stale{margin-top:12px;background:rgb(255 240 203);color:rgb(81 57 0);padding:11px 13px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin:4px 0}.stat small{color:var(--muted)}.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}.tab{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.section-head h2,.section-head h3{margin:0}.section-head p,.intro{margin:5px 0;color:var(--muted)}.count{background:var(--blue2);color:var(--blue);border-radius:999px;padding:3px 9px;font-size:13px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin:14px 0}.filters input,.filters select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px}.toggles{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}.stock-cards{display:none}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:12px;background:var(--surface2)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.stock-cell{min-width:112px}.stock-title strong{display:block;font-size:15px;white-space:nowrap}.stock-title small{color:var(--muted)}.market-summary-cell{min-width:230px}.rank{color:var(--blue);font-weight:800;margin-right:7px}.rank-cell{color:var(--blue);font-weight:800}.up{color:var(--red)}.down{color:var(--green)}.tag{padding:2px 7px;margin:2px;color:var(--muted)}.tag.hot{color:var(--red);background:rgb(253 232 234)}.tag.warn{color:var(--amber);background:var(--amberbg)}.spark{width:118px;height:38px;display:block}.detail-row>td{padding:0}.detail-row>td>.detail{width:0;min-width:100%;padding:14px;background:var(--surface2)}.detail-toggle{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}details{min-width:0;max-width:100%}details summary{cursor:pointer;color:var(--blue);font-weight:700}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.detail-grid div{background:var(--surface);padding:9px;border-radius:8px;overflow-wrap:anywhere}.detail-grid dt{font-size:11px;color:var(--muted)}.detail-grid dd{margin:2px 0;font-size:13px}.orderbook-line{margin:7px 0;color:var(--muted);font-size:13px}.orderbook-summary{font-variant-numeric:tabular-nums}.orderbook-detail{min-width:0;max-width:100%;margin-top:12px}.orderbook-detail h4{margin:0 0 6px}.orderbook-table-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}.orderbook-table{width:100%;min-width:0;table-layout:fixed;font-size:12px}.orderbook-table th,.orderbook-table td{padding:6px 4px;text-align:right;white-space:nowrap}.subsection{margin-top:18px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}.metric-card h3{margin:0 0 8px}.metric-card dl{margin:0}.metric-card div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.metric-card dt{color:var(--muted)}.metric-card dd{margin:0;font-weight:700}.recent{display:grid;gap:8px}.recent-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}.explain-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.explain-list article{background:var(--surface2);border-radius:12px;padding:14px}.explain-list h3{margin:0 0 6px;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:18px 4px}.unlock{max-width:480px;margin:12vh auto;background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}.unlock input{width:100%;padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:9px}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px}.logout{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow)}.error{color:var(--red)}[hidden]{display:none!important}
.intraday-line{margin:7px 0;color:var(--muted);font-size:13px}.intraday-summary{font-variant-numeric:tabular-nums}.intraday-detail{min-width:0;max-width:100%;margin-top:12px}.intraday-detail h4{margin:0 0 6px}.intraday-warning{display:block;color:var(--amber)}.intraday-chart{display:block;width:100%;height:auto;max-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0}.key-trades-detail{min-width:0}.key-trades-detail h5{margin:0 0 5px;font-size:13px}.key-trades-table-wrap{max-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px}.key-trades-table{width:100%;min-width:0;table-layout:fixed;font-size:11px}.key-trades-table th,.key-trades-table td{padding:5px 2px;text-align:right;white-space:nowrap}.key-trades-table th:first-child,.key-trades-table td:first-child{text-align:left}.key-trades-table td.key-trades-row-message{text-align:left;white-space:normal}.key-trades-mobile{display:none}.key-trades-totals,.key-trades-note,.key-trades-unavailable,.key-trades-closing-note{margin:7px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.key-trade-mobile-message{margin:8px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
@media(min-width:768px){.intraday-layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:12px;align-items:start}.intraday-layout-key-only{grid-template-columns:1fr}.intraday-layout .intraday-chart{max-height:none;max-width:400px;margin:0}.intraday-chart text{font-size:8px}}

@media(max-width:767px){.stat strong{font-size:21px}.panel{padding:12px}}
@media(prefers-color-scheme:dark){:root{--bg:rgb(8 19 29);--surface:rgb(16 31 44);--surface2:rgb(21 40 55);--text:rgb(230 240 246);--muted:rgb(156 176 191);--line:rgb(41 64 80);--blue:rgb(120 201 240);--blue2:rgb(23 60 81);--red:rgb(255 135 147);--green:rgb(98 209 168);--amber:rgb(242 199 121);--amberbg:rgb(64 53 30);--shadow:none}.hero{background:linear-gradient(135deg,rgb(10 38 58),rgb(16 76 106))}.stale{background:rgb(58 48 26);color:rgb(255 227 164)}.tag.hot{background:rgb(72 36 43)}}

function formatOrderbookPrice(value) {
  const text = String(value ?? "—");
  if (!/^-?\d+\.\d+$/.test(text)) return text;
  return text.replace(/0+$/, "").replace(/\.$/, "");
}

function renderDetail(data, listId, market, code, view) {
  if (!['card', 'table'].includes(view)) return "";
  const list = Object.values(data.lists || {}).find(candidate =>
    String(candidate?.list_id) === String(listId));
  const item = (list?.candidates || []).find(candidate =>
    String(candidate?.market) === String(market) && String(candidate?.code) === String(code));
  if (!item) return "";
  const esc = value => String(value ?? "—").replace(/[&<>"']/g, character =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
  const number = (value, digits=2) => value === null || value === undefined
    ? "—"
    : Number(value).toLocaleString("zh-TW", {
        maximumFractionDigits:digits, minimumFractionDigits:digits
      });
  const pct = value => value === null || value === undefined
    ? "未知" : `${value >= 0 ? "+" : "−"}${number(Math.abs(value) * 100)}%`;
  const daytradeRate = value => value === null || value === undefined
    ? "未知" : `${number(value * 100)}%`;
  const fields = candidate => {
    const names = {signal_close:"T 日收盤",price_change_rate_display:"T 日漲跌幅",target_limit_up:"T+1 漲停價",target_limit_source:"漲停價來源",volume_ratio_20:"20 日量比",capital_group:"資本額區間",attention_on_signal:"T 日注意",disposal_on_target:"T+1 處置",disposal_matching_interval_minutes:"撮合間隔（分鐘）",disposal_prepayment_required:"需要預收款券",disposal_prepayment_threshold:"預收門檻",daytrade_on_signal:"T 日當沖名單",daytrade_volume:"T 日當沖成交股數",daytrade_ratio:"T 日當沖比率",touched_limit_not_close:"T 日碰過漲停",board_streak:"連板數",one_price_limit:"一價漲停",is_innovation_board:"創新板",is_ky:"KY"};
    return Object.entries(names).filter(([key]) => key in candidate).map(([key, label]) =>
      `<div><dt>${esc(label)}</dt><dd>${key === "daytrade_ratio" ? daytradeRate(candidate[key]) : key.includes("rate") ? pct(candidate[key]) : esc(candidate[key])}</dd></div>`).join("");
  };
  const orderbookDetail = candidate => {
    const book = candidate.orderbook;
    if (!book) return "";
    const side = level => level
      ? `<td>${esc(formatOrderbookPrice(level.price))}</td><td>${esc(number(level.lots, 0))}</td>`
      : `<td colspan="2">無</td>`;
    const rows = Array.from({length:5}, (_, index) =>
      `<tr><th scope="row">${index + 1}</th>${side(book.bid_levels?.[index])}${side(book.ask_levels?.[index])}</tr>`).join("");
    return `<section class="orderbook-detail"><h4>收盤五檔明細</h4><div class="orderbook-table-wrap"><table class="orderbook-table"><thead><tr><th>檔位</th><th>委買價</th><th>委買量</th><th>委賣價</th><th>委賣量</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  };
  const intradayChart = minute => {
    const values = (minute.close || []).map(Number).filter(Number.isFinite);
    const finiteGuide = value => value !== null && value !== undefined
      && Number.isFinite(Number(value));
    const guides = [minute.upper_limit, minute.previous_close].filter(finiteGuide).map(Number);
    if (!values.length) return "";
    const lo = Math.min(...values, ...guides), hi = Math.max(...values, ...guides);
    const span = Math.max(.01, hi - lo);
    const x = value => 8 + Math.max(0, Math.min(270, Number(value))) / 270 * 304;
    const y = value => 132 - (Number(value) - lo) / span * 116;
    const points = (minute.minutes || []).map((value, index) =>
      `${x(value).toFixed(2)},${y(minute.close[index]).toFixed(2)}`).join(" ");
    const guide = (value, label, dash) => finiteGuide(value)
      ? `<line x1="8" y1="${esc(y(value).toFixed(2))}" x2="312" y2="${esc(y(value).toFixed(2))}" stroke="currentColor" stroke-dasharray="${esc(dash)}" opacity=".55"/><text x="10" y="${esc(Math.max(12, y(value) - 3).toFixed(2))}" font-size="9" fill="currentColor">${esc(label)}</text>` : "";
    return `<svg class="intraday-chart" viewBox="0 0 320 140" role="img" aria-label="${esc("1 分鐘價格走勢")}">${guide(minute.upper_limit, "漲停價", "5 4")}${guide(minute.previous_close, "前一日收盤價", "2 3")}<polyline points="${esc(points)}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  };
  const keyTradesDetail = candidate => {
    const key = candidate.key_trades;
    if (!key) return `<section class="key-trades-detail"><h5>${esc("關鍵成交")}</h5><p class="key-trades-unavailable">${esc("未取得")}</p></section>`;
    const price = value => value === null || value === undefined
      ? "—" : Number(value).toFixed(2);
    const marketPrice = value => value === null || value === undefined
      ? "—" : Number(value) === 0 ? "市價" : price(value);
    const tradeRow = (label, trade, message="") => `<tr><th scope="row">${esc(label)}</th>`
      + (message ? `<td colspan="5" class="key-trades-row-message">${esc(message)}</td></tr>`
      : `<td>${esc(trade?.time_taipei)}</td><td>${esc(price(trade?.price))}</td>`
      + `<td>${esc(trade?.size)}</td><td>${esc(marketPrice(trade?.bid))}</td>`
      + `<td>${esc(marketPrice(trade?.ask))}</td></tr>`);
    const mobileValue = (label, value) => `<div class="key-trade-mobile-value">`
      + `<dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`;
    const mobileTradeCard = (shortLabel, fullLabel, trade, message="") =>
      `<article class="key-trade-mobile-card"><header class="key-trade-mobile-head">`
      + `<span class="key-trade-mobile-label"><strong>${esc(shortLabel)}</strong>`
      + (fullLabel ? `<small>${esc(fullLabel)}</small>` : "")
      + `</span><time>${esc(trade?.time_taipei)}</time>`
      + `</header>` + (message ? `<p class="key-trade-mobile-message">${esc(message)}</p>`
      : `<dl class="key-trade-mobile-values">`
      + mobileValue("成交價", price(trade?.price))
      + mobileValue("單量", trade?.size)
      + mobileValue("買價", marketPrice(trade?.bid))
      + mobileValue("賣價", marketPrice(trade?.ask))
      + `</dl>`) + `</article>`;
    const knownLots = key.volume_unit === "張";
    const closingLabels = {
      closing_auction: {label:"收盤", short:"收盤", full:""},
      delayed_close: {label:"收盤（暫緩收盤）", short:"收盤", full:"暫緩收盤"},
      last_trade: {label:"最後成交", short:"最後", full:"最後成交"},
    };
    const closing = closingLabels[key.closing_kind] || closingLabels.closing_auction;
    const afterhoursMessage = key.afterhours_trade ? ""
      : key.afterhours_status === "known_absent" ? "當日無盤後定價成交" : "未取得";
    const rows = tradeRow("開盤第一筆", key.opening_trade)
      + tradeRow(closing.label, key.closing_trade)
      + tradeRow("盤後定價", key.afterhours_trade, afterhoursMessage);
    const mobileCards = mobileTradeCard("開盤", "開盤第一筆", key.opening_trade)
      + mobileTradeCard(closing.short, closing.full, key.closing_trade)
      + mobileTradeCard("盤後", "盤後定價", key.afterhours_trade, afterhoursMessage);
    const closingNote = key.closing_kind === "last_trade"
      ? `<p class="key-trades-closing-note">${esc("13:30 無成交，顯示最後一筆")}</p>` : "";
    const totals = key.totals;
    const ratio = totals?.ask_ratio === null || totals?.ask_ratio === undefined
      ? "未知" : `${number(totals.ask_ratio * 100, 1)}%`;
    const totalLine = totals
      ? `內盤 ${number(totals.trade_volume_at_bid, 0)}、外盤 ${number(totals.trade_volume_at_ask, 0)}、未分類 ${number(totals.unclassified_volume, 0)}、外盤比 ${ratio}`
      : `內外盤：未取得${key.reason ? `（${key.reason}）` : ""}`;
    const unitNote = knownLots ? "" : `<p class="key-trades-note">${esc("量的單位待確認；保留資料商原值，未換算。")}</p>`;
    return `<section class="key-trades-detail"><h5>${esc("關鍵成交")}</h5><div class="key-trades-table-wrap"><table class="key-trades-table"><thead><tr><th>${esc("時段")}</th><th>${esc("時間")}</th><th>${esc("成交價")}</th><th>${esc(knownLots ? "單量（張）" : "單量")}</th><th>${esc("買價")}</th><th>${esc("賣價")}</th></tr></thead><tbody>${rows}</tbody></table></div><div class="key-trades-mobile">${mobileCards}<p class="key-trades-mobile-unit">${esc(`單量單位：${knownLots ? "張" : "待確認"}`)}</p></div>${closingNote}<p class="key-trades-totals">${esc(totalLine)}</p>${unitNote}<p class="key-trades-note">${esc("富果口徑：內外盤計算扣除開盤時第一筆集中撮合成交；盤後交易不計入盤中累計量。數字可能和券商 App 不同。內盤為成交於買價；外盤為成交於賣價。")}</p></section>`;
  };
  const intradayDetail = candidate => {
    const minute = candidate.intraday;
    const chart = minute ? intradayChart(minute) : "";
    const key = keyTradesDetail(candidate);
    const layout = chart ? "" : " intraday-layout-key-only";
    return `<section class="intraday-detail"><h4>${esc("分時明細")}</h4><div class="intraday-layout${layout}">${chart}${key}</div></section>`;
  };
  return `<dl class="detail-grid">${fields(item)}</dl>${orderbookDetail(item)}${intradayDetail(item)}`;
}

function renderApp(data, state = {}) {
  const tab = state.tab || "today";
  const filterState = state.filters?.[tab] || state;
  const isTomorrow = tab === "tomorrow" || tab === "performance";
  const allowedSorts = isTomorrow ? ["rank","change","volume","code"] : ["streak","change","volume","code"];
  const query = (filterState.query || "").trim().toLowerCase();
  const market = filterState.market || "all";
  const capital = filterState.capital || "all";
  const sort = allowedSorts.includes(filterState.sort) ? filterState.sort : (isTomorrow ? "rank" : "streak");
  const hideDisposal = Boolean(filterState.hideDisposal);
  const onlyDaytrade = Boolean(filterState.onlyDaytrade);
  const esc = value => String(value ?? "—").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const number = (value, digits=2) => value === null || value === undefined ? "—" : Number(value).toLocaleString("zh-TW", {maximumFractionDigits:digits, minimumFractionDigits:digits});
  const pct = value => value === null || value === undefined ? "未知" : `${value >= 0 ? "+" : "−"}${number(Math.abs(value) * 100)}%`;
  const rate = value => value === null || value === undefined ? "尚未累積" : `${number(value * 100)}%`;

  if(tab==="explain") content=`<section class="panel"><h2>說明</h2><div class="explain-list"><article><h3>T 與 T+1</h3><p>T 是清單資料交易日，T+1 是交易日曆中的下一個交易日，不是曆日加一。</p></article><article><h3>收盤與漲跌幅</h3><p>官方盤後收盤價；紅色加號代表上漲，綠色減號代表下跌，並以符號輔助辨識。</p></article><article><h3>20 日量比</h3><p>T 日成交量相對前 20 個可用交易日的平均；資料不足時顯示未知。</p></article><article><h3>處置與當沖</h3><p>處置顯示撮合間隔與預收門檻；當沖名單以 T 日官方名單為準。</p></article><article><h3>收盤五檔</h3><p>${esc(data.explanation?.orderbook_note)}</p></article><article><h3>1 分鐘分時</h3><p>${esc(data.explanation?.intraday_note)}</p></article><article><h3>關鍵成交與內外盤</h3><p>${esc(data.explanation?.key_trades_note)}</p></article><article><h3>前瞻截止規則</h3><p>${esc(data.explanation?.cutoff_rule)}</p></article><article><h3>資料來源與更新</h3><p>${(data.explanation?.sources||[]).map(esc).join("、")}。${esc(data.explanation?.update_rule)}</p></article></div></section>`;
  return `<div class="shell">${hero}${stats}${nav}${content}<footer>${esc(data.disclaimer)} 數字均由版本化資料與程式產生。</footer></div>`;

<script>
function startSite(data) {
  const root = document.getElementById("site-root");
  const common = {query:"",market:"all",capital:"all",hideDisposal:false,onlyDaytrade:false};
  const state = {tab:"today",filters:{today:{...common,sort:"streak"},tomorrow:{...common,sort:"rank"}}};
  let searchTimer = null;
  let composing = false;
  const cancelSearchTimer = () => {
    if (searchTimer !== null) {
      clearTimeout(searchTimer);
      searchTimer = null;
    }
  };
  const hydrateDetail = owner => {
    const container = owner.querySelector("[data-detail-container]");
    if (!container || container.dataset.hydrated === "true") return;
    const {listId, market, code, view, detailKey} = owner.dataset;
    if (detailKey !== JSON.stringify([listId, market, code, view])) return;
    container.innerHTML = renderDetail(data, listId, market, code, view);
    container.dataset.hydrated = "true";
  };
  const scheduleSearch = control => {
    cancelSearchTimer();
    const tab = state.tab;
    state.filters[tab].query = control.value;
    const selection = {
      tab,
      start:control.selectionStart ?? control.value.length,
      end:control.selectionEnd ?? control.value.length,
      direction:control.selectionDirection || "none",
    };
    searchTimer = setTimeout(() => {
      searchTimer = null;
      if (state.tab === tab) draw(selection);
    }, 200);
  };
  function draw(searchSelection = null) {
    cancelSearchTimer();
    composing = false;
    root.innerHTML = renderApp(data, state);
    root.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => {
      cancelSearchTimer();
      state.tab = button.dataset.tab;
      draw();
      window.scrollTo({top:0,behavior:"smooth"});
    }));
    root.querySelectorAll("details[data-detail-key]").forEach(details =>
      details.addEventListener("toggle", () => {
        if (details.open) hydrateDetail(details);
      }));
    root.querySelectorAll("[data-detail-target]").forEach(button => button.addEventListener("click", () => {
      const detailRow = document.getElementById(button.dataset.detailTarget);
      if (!detailRow) return;
      const expand = detailRow.hidden;
      if (expand) hydrateDetail(detailRow);
      detailRow.hidden = !expand;
      button.setAttribute("aria-expanded", String(expand));
    }));
    root.querySelectorAll("[data-filter]").forEach(control => {
      const isSearch = control.tagName === "INPUT" && control.type === "text";
      if (isSearch) {
        control.addEventListener("compositionstart", () => {
          composing = true;
          cancelSearchTimer();
        });
        control.addEventListener("compositionend", () => {
          composing = false;
          scheduleSearch(control);
        });
        control.addEventListener("input", () => {
          state.filters[state.tab].query = control.value;
          if (!composing) scheduleSearch(control);
        });
      } else {
        control.addEventListener("change", () => {
          cancelSearchTimer();
          state.filters[state.tab][control.dataset.filter] = control.type === "checkbox"
            ? control.checked : control.value;
          draw();
        });
      }
    });
    if (searchSelection?.tab === state.tab) {
      const search = root.querySelector('[data-filter="query"]');
      if (search) {
        search.focus();
        const length = search.value.length;
        search.setSelectionRange(
          Math.min(searchSelection.start, length),
          Math.min(searchSelection.end, length),
          searchSelection.direction);
      }
    }
  }
  draw();
}

(() => {const storageKey="tw-limitup-site-password",payload=JSON.parse(document.getElementById("payload").textContent),app=document.getElementById("unlock-app"),form=document.getElementById("unlock"),input=document.getElementById("password"),error=document.getElementById("error"),logout=document.getElementById("logout");app.hidden=false;async function unlock(password){error.textContent="";try{const text=await decryptPayload(password,payload);startSite(JSON.parse(text));localStorage.setItem(storageKey,password);app.hidden=true;logout.hidden=false;}catch(failure){document.getElementById("site-root").textContent="";localStorage.removeItem(storageKey);app.hidden=false;logout.hidden=true;error.textContent="密碼錯誤，請重試。";}}form.addEventListener("submit",event=>{event.preventDefault();unlock(input.value);});logout.addEventListener("click",()=>{localStorage.removeItem(storageKey);location.reload();});const saved=localStorage.getItem(storageKey);if(saved)unlock(saved);})();</script></body></html>
