2 234)}.tag.warn{color:var(--amber);background:var(--amberbg)}.spark{width:118px;height:38px;display:block}.detail-row>td{padding:0}.detail-row>td>.detail{width:0;min-width:100%;padding:14px;background:var(--surface2)}.detail-toggle{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}details{min-width:0;max-width:100%}details summary{cursor:pointer;color:var(--blue);font-weight:700}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.detail-grid div{background:var(--surface);padding:9px;border-radius:8px;overflow-wrap:anywhere}.detail-grid dt{font-size:11px;color:var(--muted)}.detail-grid dd{margin:2px 0;font-size:13px}.orderbook-line{margin:7px 0;color:var(--muted);font-size:13px}.orderbook-summary{font-variant-numeric:tabular-nums}.orderbook-detail{min-width:0;max-width:100%;margin-top:12px}.orderbook-detail h4{margin:0 0 6px}.orderbook-table-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}.orderbook-table{width:100%;min-width:0;table-layout:fixed;font-size:12px}.orderbook-table th,.orderbook-table td{padding:6px 4px;text-align:right;white-space:nowrap}.subsection{margin-top:18px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}.metric-card h3{margin:0 0 8px}.metric-card dl{margin:0}.metric-card div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.metric-card dt{color:var(--muted)}.metric-card dd{margin:0;font-weight:700}.recent{display:grid;gap:8px}.recent-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}.explain-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.explain-list article{background:var(--surface2);border-radius:12px;padding:14px}.explain-list h3{margin:0 0 6px;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:18px 4px}.unlock{max-width:480px;margin:12vh auto;background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}.unlock input{width:100%;padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:9px}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px}.logout{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow)}.error{color:var(--red)}[hidden]{display:none!important}

ace:nowrap;font-variant-numeric:tabular-nums}.key-trade-mobile-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin:8px 0 0}.key-trade-mobile-value{min-width:0}.key-trade-mobile-value dt{color:var(--muted);font-size:11px}.key-trade-mobile-value dd{margin:1px 0 0;font-size:12px;font-weight:700;overflow-wrap:anywhere}.key-trades-mobile-unit{margin:0;color:var(--muted);font-size:11px}.cards3{grid-template-columns:1fr}.recent-row{grid-template-columns:1fr 1fr}.explain-list{grid-template-columns:1fr}.section-head{align-items:center}}

const MIN_CLASSIFIED_VOLUME_LOTS = 100;

function formatOrderbookPrice(value) {
  const text = String(value ?? "—");
  if (!/^-?\d+\.\d+$/.test(text)) return text;
  return text.replace(/0+$/, "").replace(/\.$/, "");
}

function normalizedAskRatio(value) {
  return typeof value === "number" && Number.isFinite(value) && value >= 0 && value <= 1
    ? value : null;
}

function renderDetail(data, listId, market, code, view) {
  if (!['card', 'table'].includes(view)) return "";
  const list = Object.values(data.lists || {}).find(candidate =>
    String(candidate?.list_id) === String(listId));
  const item = (list?.candidates || []).find(candidate =>
    String(candidate?.market) === String(market) && String(candidate?.code) === String(code));
  if (!item) return "";
  const esc = value => String(value ?? "—").replace(/[&<>"']/g, character =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
  const number = (value, digits=2) => value === null || value === undefined
    ? "—"
    : Number(value).toLocaleString("zh-TW", {
        maximumFractionDigits:digits, minimumFractionDigits:digits
      });
  const pct = value => value === null || value === undefined
    ? "未知" : `${value >= 0 ? "+" : "−"}${number(Math.abs(value) * 100)}%`;
  const daytradeRate = value => value === null || value === undefined
    ? "未知" : `${number(value * 100)}%`;
  const fields = candidate => {
    const names = {signal_close:"T 日收盤",price_change_rate_display:"T 日漲跌幅",target_limit_up:"T+1 漲停價",target_limit_source:"漲停價來源",volume_ratio_20:"20 日量比",capital_group:"資本額區間",attention_on_signal:"T 日注意",disposal_on_target:"T+1 處置",disposal_matching_interval_minutes:"撮合間隔（分鐘）",disposal_prepayment_required:"需要預收款券",disposal_prepayment_threshold:"預收門檻",daytrade_on_signal:"T 日當沖名單",daytrade_volume:"T 日當沖成交股數",daytrade_ratio:"T 日當沖比率",touched_limit_not_close:"T 日碰過漲停",board_streak:"連板數",one_price_limit:"一價漲停",is_innovation_board:"創新板",is_ky:"KY"};
    return Object.entries(names).filter(([key]) => key in candidate).map(([key, label]) =>
      `<div><dt>${esc(label)}</dt><dd>${key === "daytrade_ratio" ? daytradeRate(candidate[key]) : key.includes("rate") ? pct(candidate[key]) : esc(candidate[key])}</dd></div>`).join("");
  };
  const orderbookDetail = candidate => {
    const book = candidate.orderbook;
    if (!book) return "";
    const side = level => level
      ? `<td>${esc(formatOrderbookPrice(level.price))}</td><td>${esc(number(level.lots, 0))}</td>`
      : `<td colspan="2">無</td>`;
    const rows = Array.from({length:5}, (_, index) =>
      `<tr><th scope="row">${index + 1}</th>${side(book.bid_levels?.[index])}${side(book.ask_levels?.[index])}</tr>`).join("");
    return `<section class="orderbook-detail"><h4>收盤五檔明細</h4><div class="orderbook-table-wrap"><table class="orderbook-table"><thead><tr><th>檔位</th><th>委買價</th><th>委買量</th><th>委賣價</th><th>委賣量</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  };
  const intradayChart = minute => {
    const values = (minute.close || []).map(Number).filter(Number.isFinite);
    const finiteGuide = value => value !== null && value !== undefined

    const guides = [minute.upper_limit, minute.previous_close].filter(finiteGuide).map(Number);
    if (!values.length) return "";

    const x = value => 8 + Math.max(0, Math.min(270, Number(value))) / 270 * 304;
    const y = value => 132 - (Number(value) - lo) / span * 116;

  };
  const keyTradesDetail = candidate => {

    if (!key) return `<section class="key-trades-detail"><h5>${esc("關鍵成交")}</h5><p class="key-trades-unavailable">${esc("未取得")}</p></section>`;

function renderApp(data, state = {}) {

  const rate = value => value === null || value === undefined ? "尚未累積" : `${number(value * 100)}%`;

  };

  const listSection = (list,title,description) => `<section class="panel subsection"><div class="section-head"><div><h2>${title}</h2><p>${description}</p></div><span class="count">${list?.status==="waiting_for_input"?"等待中":`${list?.count ?? 0} 檔`}</span></div>${list?.status==="waiting_for_input"?`<div class="empty">${esc(list.message||"當沖量尚未公布，21:00 後產生")}</div>`:stockViews(list)}</section>`;
  const perfCard = (listId,label) => { const p=data.performance?.[listId]||{}, v2=listId.endsWith("_v2"), dt=listId==="B_R2_dt_v1", buckets=(p.rank_buckets||[]).map(row=>`<div><dt>#${esc(row.bucket)}</dt><dd>${rate(row.precision_daily_mean)}</dd></div>`).join(""); return `<article class="metric-card"><h3>${label}</h3><dl><div><dt>有效天數</dt><dd>${p.valid_days ?? 0}</dd></div><div><dt>事件數</dt><dd>${p.event_n ?? 0}</dd></div><div><dt>${dt?"每日命中率":`P@${v2?30:10} 每日平均`}</dt><dd>${rate(p.precision_daily_mean)}</dd></div><div><dt>同期基準</dt><dd>${rate(p.baseline_daily_mean)}</dd></div>${buckets}<div><dt>報酬 (a) 平均</dt><dd>${rate(p.return_a_mean)}</dd></div></dl></article>`; };
  const recent = (listId,label) => { const rows=data.recent_results?.[listId]||[]; return `<section class="panel subsection"><h3>${label}：最近 10 個交易日</h3><div class="recent">${rows.length ? rows.map(row=>{const note=row.backfill?`<small>事後補上（${esc(row.decision)}）</small>`:""; return row.status==="pending"?`<div class="recent-row"><strong>${esc(row.signal_date)} → ${esc(row.target_date)} ${note}</strong><span>尚未對答案</span><span>—</span><span>—</span></div>`:`<div class="recent-row"><strong>${esc(row.signal_date)} → ${esc(row.target_date)} ${note}</strong><span>命中 ${row.hit_n}/${row.known_n}</span><span>開盤鎖死 ${row.open_locked_n}</span><span>報酬 ${rate(row.return_a_mean)}</span></div>`;}).join("") : `<div class="empty">尚未對答案</div>`}</div></section>`; };
  const meta=data.meta||{}, summary=data.summary||{};
  const degradedReason=(meta.degraded_sources||[]).map(item=>item.source||"未知來源").join("、");
  const hero=`<header class="hero"><div class="eyebrow">TAIWAN LIMIT-UP RESEARCH</div><h1>台股漲停前瞻紀錄</h1><div class="dates">${esc(meta.signal_date||"尚無")} T → ${esc(meta.target_date||"尚無")} T+1</div><div class="meta-line"><span class="pill ${meta.is_latest?"ok":"warn"}">${meta.is_latest?"最新":"非最新"}</span><span class="pill ${meta.data_status==="complete"?"ok":"warn"}">${meta.data_status==="complete"?"資料完整":"資料不完整"}</span><span class="pill warn">初步</span><span class="pill warn">歷史統計</span><span class="pill warn">不是買賣建議</span></div>${meta.stale_reason?`<div class="stale" role="status">${esc(meta.stale_reason)}</div>`:""}${degradedReason?`<div class="stale" role="status">資料不完整：${esc(degradedReason)}</div>`:""}<p class="hero-note">產生時間 ${esc(meta.generated_at||"尚無")} · 執行狀態 ${esc(meta.status_text||"尚無")}</p></header>`;
  const stats=`<section class="stats"><article class="stat"><span>今日收盤漲停</span><strong>${summary.limit_up_n ?? "—"} 檔</strong><small>連 3 板以上 ${summary.board_streak_3_n ?? "—"} · 一價 ${summary.one_price_n ?? "—"}</small></article><article class="stat"><span>明日候選 R2 v2</span><strong>${summary.r2_n ?? "—"} 檔</strong><small>依規則排序，不是機率</small></article><article class="stat"><span>A 累計開盤買不到</span><strong>${rate(summary.a_unavailable_rate)}</strong><small>${summary.a_unavailable_n ?? 0}/${summary.a_event_n ?? 0}</small></article><article class="stat"><span>R2 v2 前瞻 P@30／同期基準</span><strong>${rate(summary.r2_precision)}</strong><small>基準 ${rate(summary.r2_baseline)}</small></article></section>`;
  const nav=`<nav class="tabs" aria-label="內容分頁">${[["today","今日漲停"],["tomorrow","明日可能漲停"],["performance","前瞻成績"],["explain","說明"]].map(([value,label])=>`<button class="tab ${tab===value?"active":""}" data-tab="${value}" aria-label="切換到${label}">${label}</button>`).join("")}</nav>`;
  let content="";
  if(tab==="today") content=`<section class="panel"><div class="section-head"><div><h2>今日漲停</h2><p>T 日收盤漲停清單，觀察 T+1 的可買性與結果。</p></div><span class="count">${data.lists?.A_all_v0?.count ?? 0} 檔</span></div>${filters()}${stockViews(data.lists?.A_all_v0)}</section>`;
  if(tab==="tomorrow") { const r2=data.m2_reference?.m2_t4?.R2||{}, dt=data.m2_reference?.m2_t5||{}, buckets=(r2.rank_buckets||[]).map(row=>`#${esc(row.bucket)} ${rate(row.precision)}`).join("、"); content=`<section class="panel"><h2>明日可能漲停</h2><p class="intro">歷史命中率 ${rate(r2.precision)}（${r2.hit_n ?? 0}/${r2.selected_known_n ?? 0}），同日基準 ${rate(r2.baseline_precision)}；${returnSummary(r2)}。資料期間 ${period(r2)}。名次分段：${buckets}。第 21～30 名多半只在碰漲停股票很多的熱門日才有；同一天比較，各段名次的命中率差不多，不代表後面的名次比較好。</p>${filters()}</section>${listSection(data.lists?.B_R2_v2,"主要規則 R2 v2","前 30 名、不設成交金額門檻；命中率不是獲利保證。")}${listSection(data.lists?.B_R2_dt_v1,"R2 v2 中當沖比率高",daytradeSummary(dt))}${listSection(data.lists?.B_R1_v2,"對照 R1 v2","前 30 名、不設成交金額門檻；只按 T 日漲幅排序。")}`; }
  if(tab==="performance") content=`<section class="panel"><h2>累計前瞻成績</h2><p class="intro">只計入開盤前寫入的第一版清單；11/10 依 D-036 計入事後補上的版本；未知結果不當成 0。</p><div class="cards3">${perfCard("A_all_v0","今日漲停 A")}${perfCard("B_R2_v2","主要規則 R2 v2")}${perfCard("B_R2_dt_v1","R2 v2 中當沖比率高")}${perfCard("B_R1_v2","對照 R1 v2")}</div></section><section class="panel subsection"><h2>舊規則（前 10 名、成交金額 ≥ 1,000 萬）</h2><div class="cards3">${perfCard("B_R2_v1","舊規則 R2 v1")}${perfCard("B_R1_v1","舊規則 R1 v1")}</div></section>${listSection(data.lists?.B_R2_v1,"舊規則 R2 v1 名單","保留原名次；分時只供參考。")}${listSection(data.lists?.B_R1_v1,"舊規則 R1 v1 名單","保留原名次；分時只供參考。")}${recent("A_all_v0","A")}${recent("B_R2_v2","R2 v2")}${recent("B_R2_dt_v1","R2 v2 中當沖比率高")}${recent("B_R1_v2","R1 v2")}${recent("B_R2_v1","R2 v1 舊規則")}${recent("B_R1_v1","R1 v1 舊規則")}`;
  if(tab==="explain") content=`<section class="panel"><h2>說明</h2><div class="explain-list"><article><h3>T 與 T+1</h3><p>T 是清單資料交易日，T+1 是交易日曆中的下一個交易日，不是曆日加一。</p></article><article><h3>收盤與漲跌幅</h3><p>官方盤後收盤價；紅色加號代表上漲，綠色減號代表下跌，並以符號輔助辨識。</p></article><article><h3>20 日量比</h3><p>T 日成交量相對前 20 個可用交易日的平均；資料不足時顯示未知。</p></article><article><h3>處置與當沖</h3><p>處置顯示撮合間隔與預收門檻；當沖名單以 T 日官方名單為準。</p></article><article><h3>收盤五檔</h3><p>${esc(data.explanation?.orderbook_note)}</p></article><article><h3>1 分鐘分時</h3><p>${esc(data.explanation?.intraday_note)}</p></article><article><h3>關鍵成交與內外盤</h3><p>${esc(data.explanation?.key_trades_note)}</p></article><article><h3>前瞻截止規則</h3><p>${esc(data.explanation?.cutoff_rule)}</p></article><article><h3>資料來源與更新</h3><p>${(data.explanation?.sources||[]).map(esc).join("、")}。${esc(data.explanation?.update_rule)}</p></article></div></section>`;

<script>
function startSite(data) {
  const root = document.getElementById("site-root");
  const common = {query:"",market:"all",capital:"all",askRatio:"all",hideDisposal:false,onlyDaytrade:false};
  const state = {tab:"today",filters:{today:{...common,sort:"streak"},tomorrow:{...common,sort:"rank"}}};
  let searchTimer = null;
  let composing = false;
  const cancelSearchTimer = () => {
    if (searchTimer !== null) {
      clearTimeout(searchTimer);
      searchTimer = null;
    }
  };
  const hydrateDetail = owner => {
    const container = owner.querySelector("[data-detail-container]");
    if (!container || container.dataset.hydrated === "true") return;
    const {listId, market, code, view, detailKey} = owner.dataset;
    if (detailKey !== JSON.stringify([listId, market, code, view])) return;
    container.innerHTML = renderDetail(data, listId, market, code, view);
    container.dataset.hydrated = "true";
  };
  const scheduleSearch = control => {
    cancelSearchTimer();
    const tab = state.tab;
    state.filters[tab].query = control.value;
    const selection = {
      tab,
      start:control.selectionStart ?? control.value.length,
      end:control.selectionEnd ?? control.value.length,
      direction:control.selectionDirection || "none",
    };
    searchTimer = setTimeout(() => {
      searchTimer = null;
      if (state.tab === tab) draw(selection);
    }, 200);
  };
  function draw(searchSelection = null) {
    cancelSearchTimer();
    composing = false;
    root.innerHTML = renderApp(data, state);
    root.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => {
      cancelSearchTimer();
      state.tab = button.dataset.tab;
      draw();
      window.scrollTo({top:0,behavior:"smooth"});
    }));
    root.querySelectorAll("details[data-detail-key]").forEach(details =>
      details.addEventListener("toggle", () => {
        if (details.open) hydrateDetail(details);
      }));
    root.querySelectorAll("[data-detail-target]").forEach(button => button.addEventListener("click", () => {
      const detailRow = document.getElementById(button.dataset.detailTarget);
      if (!detailRow) return;
      const expand = detailRow.hidden;
      if (expand) hydrateDetail(detailRow);
      detailRow.hidden = !expand;
      button.setAttribute("aria-expanded", String(expand));
    }));
    root.querySelectorAll("[data-filter]").forEach(control => {
      const isSearch = control.tagName === "INPUT" && control.type === "text";
      if (isSearch) {
        control.addEventListener("compositionstart", () => {
          composing = true;
          cancelSearchTimer();
        });
        control.addEventListener("compositionend", () => {
          composing = false;
          scheduleSearch(control);
        });
        control.addEventListener("input", () => {
          state.filters[state.tab].query = control.value;
          if (!composing) scheduleSearch(control);
        });
      } else {
        control.addEventListener("change", () => {
          cancelSearchTimer();
          state.filters[state.tab][control.dataset.filter] = control.type === "checkbox"
            ? control.checked : control.value;
          draw();
        });
      }
    });
    if (searchSelection?.tab === state.tab) {
      const search = root.querySelector('[data-filter="query"]');
      if (search) {
        search.focus();
        const length = search.value.length;
        search.setSelectionRange(
          Math.min(searchSelection.start, length),
          Math.min(searchSelection.end, length),
          searchSelection.direction);
      }
    }
  }
  draw();
}

(() => {const storageKey="tw-limitup-site-password",payload=JSON.parse(document.getElementById("payload").textContent),app=document.getElementById("unlock-app"),form=document.getElementById("unlock"),input=document.getElementById("password"),error=document.getElementById("error"),logout=document.getElementById("logout");app.hidden=false;async function unlock(password){error.textContent="";try{const text=await decryptPayload(password,payload);startSite(JSON.parse(text));localStorage.setItem(storageKey,password);app.hidden=true;logout.hidden=false;}catch(failure){document.getElementById("site-root").textContent="";localStorage.removeItem(storageKey);app.hidden=false;logout.hidden=true;error.textContent="密碼錯誤，請重試。";}}form.addEventListener("submit",event=>{event.preventDefault();unlock(input.value);});logout.addEventListener("click",()=>{localStorage.removeItem(storageKey);location.reload();});const saved=localStorage.getItem(storageKey);if(saved)unlock(saved);})();</script></body></html>
