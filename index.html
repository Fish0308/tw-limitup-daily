<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>需要密碼</title><style>
:root{color-scheme:light dark;--bg:rgb(243 246 248);--surface:#fff;--surface2:rgb(237 243 247);--text:rgb(23 32 42);--muted:rgb(97 113 132);--line:rgb(217 226 232);--blue:rgb(23 107 155);--blue2:rgb(220 238 248);--red:rgb(189 49 65);--green:rgb(22 116 83);--amber:rgb(149 99 24);--amberbg:rgb(255 243 214);--shadow:0 8px 28px rgb(27 53 76 / 0.078);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:77.5rem;margin:auto;padding:18px 16px 48px}.hero{background:linear-gradient(135deg,rgb(11 41 64),rgb(24 92 127));color:rgb(244 251 255);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.14em;color:rgb(169 217 239)}.hero h1{font-size:26px;margin:3px 0 8px}.dates{font-size:17px;font-weight:700}.meta-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill,.tag{display:inline-flex;align-items:center;border:1px solid currentColor;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.pill.ok{color:rgb(169 239 210)}.pill.warn{color:rgb(255 225 162)}.hero-note{margin:14px 0 0;color:rgb(216 234 243);font-size:13px}.stale{margin-top:12px;background:rgb(255 240 203);color:rgb(81 57 0);padding:11px 13px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin:4px 0}.stat small{color:var(--muted)}.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}.tab{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.section-head h2,.section-head h3{margin:0}.section-head p,.intro{margin:5px 0;color:var(--muted)}.count{background:var(--blue2);color:var(--blue);border-radius:999px;padding:3px 9px;font-size:13px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin:14px 0}.filters input,.filters select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px}.toggles{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}.stock-cards{display:none}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:12px;background:var(--surface2)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.stock-title strong{display:block;font-size:15px}.stock-title small{color:var(--muted)}.rank{color:var(--blue);font-weight:800;margin-right:7px}.rank-cell{color:var(--blue);font-weight:800}.up{color:var(--red)}.down{color:var(--green)}.tag{padding:2px 7px;margin:2px;color:var(--muted)}.tag.hot{color:var(--red);background:rgb(253 232 234)}.tag.warn{color:var(--amber);background:var(--amberbg)}.spark{width:118px;height:38px;display:block}.detail-row td{padding:0}.detail{padding:14px;background:var(--surface2)}details{min-width:0;max-width:100%}details summary{cursor:pointer;color:var(--blue);font-weight:700}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.detail-grid div{background:var(--surface);padding:9px;border-radius:8px;overflow-wrap:anywhere}.detail-grid dt{font-size:11px;color:var(--muted)}.detail-grid dd{margin:2px 0;font-size:13px}.orderbook-line{margin:7px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.orderbook-summary{font-variant-numeric:tabular-nums}.orderbook-detail{min-width:0;max-width:100%;margin-top:12px}.orderbook-detail h4{margin:0 0 6px}.orderbook-table-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}.orderbook-table{width:100%;min-width:0;table-layout:fixed;font-size:12px}.orderbook-table th,.orderbook-table td{padding:6px 4px;text-align:right;white-space:nowrap}.subsection{margin-top:18px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}.metric-card h3{margin:0 0 8px}.metric-card dl{margin:0}.metric-card div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.metric-card dt{color:var(--muted)}.metric-card dd{margin:0;font-weight:700}.recent{display:grid;gap:8px}.recent-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}.explain-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.explain-list article{background:var(--surface2);border-radius:12px;padding:14px}.explain-list h3{margin:0 0 6px;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:18px 4px}.unlock{max-width:480px;margin:12vh auto;background:var(--surface);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}.unlock input{width:100%;padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:9px}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px}.logout{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow)}.error{color:var(--red)}[hidden]{display:none!important}
.intraday-line{margin:7px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.intraday-summary{font-variant-numeric:tabular-nums}.intraday-detail{min-width:0;max-width:100%;margin-top:12px}.intraday-detail h4{margin:0 0 6px}.intraday-warning{display:block;color:var(--amber)}.intraday-chart{display:block;width:100%;height:auto;max-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0}.intraday-table-wrap{max-width:100%;max-height:260px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:8px}.intraday-table{width:100%;min-width:0;table-layout:fixed;font-size:12px}.intraday-table th,.intraday-table td{padding:6px 4px;text-align:right;white-space:normal;overflow-wrap:anywhere}
@media(max-width:767px){.shell{padding:10px 10px 36px}.hero{border-radius:16px;padding:17px}.hero h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.table-wrap{display:none}.stock-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.stock-card{min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--surface2)}.stock-top,.price-row,.limit-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.stock-top h3{margin:0;font-size:18px}.stock-top small,.history-note{color:var(--muted)}.price-row{margin-top:9px}.price{font-size:22px;font-weight:750}.limit-row{font-size:14px;margin:3px 0 8px}.stock-card .spark{width:100%;height:55px;background:var(--surface);border-radius:8px}.tags{margin:7px -2px}.history-note{font-size:12px;margin:7px 0}.detail-grid{grid-template-columns:1fr 1fr}.orderbook-table{font-size:11px}.orderbook-table th,.orderbook-table td{padding:5px 2px}.intraday-table{font-size:11px}.intraday-table th,.intraday-table td{padding:5px 2px}.cards3{grid-template-columns:1fr}.recent-row{grid-template-columns:1fr 1fr}.explain-list{grid-template-columns:1fr}.section-head{align-items:center}}
@media(max-width:767px){.stat strong{font-size:21px}.panel{padding:12px}}
@media(prefers-color-scheme:dark){:root{--bg:rgb(8 19 29);--surface:rgb(16 31 44);--surface2:rgb(21 40 55);--text:rgb(230 240 246);--muted:rgb(156 176 191);--line:rgb(41 64 80);--blue:rgb(120 201 240);--blue2:rgb(23 60 81);--red:rgb(255 135 147);--green:rgb(98 209 168);--amber:rgb(242 199 121);--amberbg:rgb(64 53 30);--shadow:none}.hero{background:linear-gradient(135deg,rgb(10 38 58),rgb(16 76 106))}.stale{background:rgb(58 48 26);color:rgb(255 227 164)}.tag.hot{background:rgb(72 36 43)}}
</style></head><body><noscript><p>需要密碼</p></noscript>

}

  const daytradeRate = value => value === null || value === undefined ? "未知" : `${number(value * 100)}%`;
  const orderbookRate = value => value === null || value === undefined ? "未知" : `${number(value * 100, 1)}%`;
  const turnover = value => value === null || value === undefined ? "未知" : `${number(Number(value) / 1e4, 0)} 萬`;

  };
  const daytradeSummary = history => { const high=history.high||{}, low=history.low||{}, start=history.period_start?.slice(0,7).replace("-","/")||"未知", end=history.period_end?.slice(0,7).replace("-","/")||"未知"; return `M2-T5 封存測試的兩市場股票 ${start}–${end}：當沖比率高 ${rate(high.precision)}（${high.hit_n ?? 0}/${high.known_n ?? 0}），另一側 ${rate(low.precision)}（${low.hit_n ?? 0}/${low.known_n ?? 0}）；${returnSummary(high)}。逐檔當沖量通常在晚上 8～9 點後才公布，所以這份名單會在 21:00 那次更新產生。`; };

  if(tab==="explain") content=`<section class="panel"><h2>說明</h2><div class="explain-list"><article><h3>T 與 T+1</h3><p>T 是清單資料交易日，T+1 是交易日曆中的下一個交易日，不是曆日加一。</p></article><article><h3>收盤與漲跌幅</h3><p>官方盤後收盤價；紅色加號代表上漲，綠色減號代表下跌，並以符號輔助辨識。</p></article><article><h3>20 日量比</h3><p>T 日成交量相對前 20 個可用交易日的平均；資料不足時顯示未知。</p></article><article><h3>處置與當沖</h3><p>處置顯示撮合間隔與預收門檻；當沖名單以 T 日官方名單為準。</p></article><article><h3>收盤五檔</h3><p>${esc(data.explanation?.orderbook_note)}</p></article><article><h3>1 分鐘分時</h3><p>${esc(data.explanation?.intraday_note)}</p></article><article><h3>前瞻截止規則</h3><p>${esc(data.explanation?.cutoff_rule)}</p></article><article><h3>資料來源與更新</h3><p>${(data.explanation?.sources||[]).map(esc).join("、")}。${esc(data.explanation?.update_rule)}</p></article></div></section>`;
  return `<div class="shell">${hero}${stats}${nav}${content}<footer>${esc(data.disclaimer)} 數字均由版本化資料與程式產生。</footer></div>`;
}
</script>
<script>
function startSite(data) {
  const root = document.getElementById("site-root");
  const common = {query:"",market:"all",capital:"all",hideDisposal:false,onlyDaytrade:false};
  const state = {tab:"today",filters:{today:{...common,sort:"streak"},tomorrow:{...common,sort:"rank"}}};
  function draw() {
    root.innerHTML = renderApp(data, state);
    root.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => {state.tab=button.dataset.tab; draw(); window.scrollTo({top:0,behavior:"smooth"});}));
    root.querySelectorAll("[data-filter]").forEach(control => control.addEventListener(control.tagName === "INPUT" && control.type === "text" ? "input" : "change", () => {
      const keepSearchFocus = control.dataset.filter === "query";
      state.filters[state.tab][control.dataset.filter] = control.type === "checkbox" ? control.checked : control.value;
      draw();
      if (keepSearchFocus) { const search=root.querySelector('[data-filter="query"]'); search.focus(); search.setSelectionRange(search.value.length,search.value.length); }
    }));
  }
  draw();
}

(() => {const storageKey="tw-limitup-site-password",payload=JSON.parse(document.getElementById("payload").textContent),app=document.getElementById("unlock-app"),form=document.getElementById("unlock"),input=document.getElementById("password"),error=document.getElementById("error"),logout=document.getElementById("logout");app.hidden=false;async function unlock(password){error.textContent="";try{const text=await decryptPayload(password,payload);startSite(JSON.parse(text));localStorage.setItem(storageKey,password);app.hidden=true;logout.hidden=false;}catch(failure){document.getElementById("site-root").textContent="";localStorage.removeItem(storageKey);app.hidden=false;logout.hidden=true;error.textContent="密碼錯誤，請重試。";}}form.addEventListener("submit",event=>{event.preventDefault();unlock(input.value);});logout.addEventListener("click",()=>{localStorage.removeItem(storageKey);location.reload();});const saved=localStorage.getItem(storageKey);if(saved)unlock(saved);})();</script></body></html>
